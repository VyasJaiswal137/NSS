<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSS Portfolio | Vyas Jaiswal</title>

    <!-- 1. TAILWIND CSS via CDN (No install needed) -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- 2. GOOGLE FONTS (Poppins & Oswald) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />

    <!-- 3. YOUR EXTERNAL CUSTOM STYLESHEET -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ============================================ -->
    <!-- HERO SECTION - THE FULL 1440x900 CANVAS      -->
    <!-- ============================================ -->
    <section class="relative h-screen w-full overflow-hidden bg-cover bg-center"
    style="background-image: url('assets/background.jpg');">

    <!-- LAYER 2: THE OFF-WHITE OVERLAY (70% Opacity) -->
    <div class="absolute inset-0 z-0 bg-[#F8F9FA] bg-opacity-70">
    </div>

    <!-- LAYER 3: THE FLEX CONTAINER (Centers everything vertically/horizontally) -->
    <div class="relative z-10 flex h-full w-full flex-col items-center justify-center px-4">

        <!-- LAYER 4: COLLEGE LOGO (Top Right Corner) -->
        <img src="assets/college-logo.png" alt="College Logo"
        class="absolute top-6 right-6 z-20 w-16 md:w-24 lg:w-28 object-contain" />

        <!-- LAYER 5: NSS LOGO (The King) -->
        <img src="assets/nss-logo.png" alt="NSS Logo"
        class="fade-in-up delay-1 w-56 sm:w-64 md:w-72 lg:w-80 max-w-full object-contain" />

        <!-- LAYER 6: MOTTO TEXT ("Not Me But You" in NSS Red) -->
        <h1 class="fade-in-up delay-2 font-oswald mt-4 md:mt-6 text-3xl sm:text-4xl md:text-5xl lg:text-6xl tracking-wide text-[#E31B23]">
            Not Me But You
        </h1>

        <!-- LAYER 7: IDENTITY TEXT (Name | College in Navy Blue) -->
        <p class="fade-in-up delay-3 font-poppins mt-1 md:mt-2 text-sm sm:text-base md:text-xl lg:text-2xl font-medium text-[#1A2A44] tracking-wide">
            Vyas Jaiswal | TCET
        </p>

        <!-- Optional: A tiny invisible spacer to balance the bottom margin -->
        <div class="h-10 md:h-16"></div>
    </div>

    <!-- LAYER 8: THE TIRANGA STRIPE (Absolute Bottom Edge) -->
    <div class="absolute bottom-0 left-0 right-0 z-20 flex h-1.5 sm:h-2">
        <div class="flex-1 bg-[#FF9933]"></div> <!-- Saffron -->
        <div class="flex-1 bg-white"></div>    <!-- White -->
        <div class="flex-1 bg-[#138808]"></div> <!-- Green -->
    </div>

</section>

</body>
</html>
