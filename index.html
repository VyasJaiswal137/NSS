<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyas Jaiswal | NSS Portfolio</title>
    <!-- Link to your separate CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- MAIN CONTAINER: SPLIT SCREEN -->
    <div class="container">

        <!-- ============================================ -->
        <!-- LEFT PANEL (DARK NAVY + NSS THEME)           -->
        <!-- ============================================ -->
        <div class="left-panel">

            <!-- Top: NSS Logo + Name + Motto -->
            <div class="nss-header">
                <div class="nss-logo-wrapper">
                    <img src="assets/nss-logo.png" alt="NSS Logo" class="nss-logo">
                    <div class="nss-text">
                        <h1>National Service Scheme</h1>
                        <span class="motto">" Not Me But You "</span>
                    </div>
                </div>
            </div>

            <!-- Middle: Profile Photo -->
            <div class="profile-wrapper">
                <img src="assets/my-photo.jpg" alt="Vyas Jaiswal Photo" class="profile-photo">
            </div>

            <!-- Bottom: Personal Info -->
            <div class="personal-info">
                <h2 class="name">Vyas Jaiswal</h2>
                <p class="title">Aspirant - NSS Technical Team</p>
                <p class="college">Thakur College of Engineering and Technology</p>
            </div>

        </div>

        <!-- ============================================ -->
        <!-- RIGHT PANEL (LIGHT BACKGROUND + SKILLS)      -->
        <!-- ============================================ -->
        <div class="right-panel">

            <!-- Top Right: College Logo -->
            <div class="college-header">
                <img src="assets/college-logo.png" alt="College Logo" class="college-logo">
            </div>

            <!-- Skills Section -->
            <div class="skills-section">
                <h3 class="skills-heading">Technical Skills</h3>
                <div class="skills-grid">
                    <span class="skill-badge">C</span>
                    <span class="skill-badge">Java</span>
                    <span class="skill-badge">HTML5</span>
                    <span class="skill-badge">CSS3</span>
                    <span class="skill-badge">JavaScript</span>
                    <span class="skill-badge">WebDesign</span>
                </div>
            </div>

            <!-- Call to Action Button -->
            <div class="cta-wrapper">
                <a href="#" class="cta-button">View My Work →</a>
            </div>

        </div>

    </div>
</body>
</html>
